# CI for dsh-duckdb.
#
# The version matrix is deliberate: the plugin declares
# `@deepseek-ai/dsh-tools: ^0.0.1-rc.1` and is TESTED against dsh 0.2.1-rc.2
# on Node 20 and 22. A dsh release that changes the `defineTool` contract
# breaks this job loudly instead of silently degrading for users.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Install duckdb
        run: |
          curl -sL https://github.com/duckdb/duckdb/releases/download/v1.2.2/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install -m755 /tmp/duckdb/duckdb /usr/local/bin/duckdb
          duckdb --version

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install peer dependency
        run: npm install --no-save @deepseek-ai/dsh-tools@0.0.1-rc.1

      - name: Unit tests
        run: node --test

      - name: Key-free e2e
        run: node tests/e2e/keyless.mjs
